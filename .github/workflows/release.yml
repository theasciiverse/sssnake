# Builds sssnake for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named <id>-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux binary, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.4.0+20261025-av.1: upstream's version (and the date of
# the upstream commit, when it is past the release), then our packaging
# release. Plain C with termbox2 in one header, no libraries. Linux builds
# run in Alpine, so the binaries are static (musl). No Windows: termbox2 is
# POSIX only.

name: release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: sssnake
  BIN: sssnake
  TAG: ${{ inputs.tag || github.ref_name }}
  SOURCES: main.c autopilot.c xymap.c structs.c snake.c draw.c

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          mkdir -p out
          docker run --rm -v "$PWD":/src -w /src -e SOURCES alpine:3.22 sh -c '
            apk add --no-cache gcc musl-dev &&
            cc -O2 -static -w $SOURCES -o out/sssnake &&
            strip out/sssnake'
          sudo chown -R "$(id -u):$(id -g)" out
          file out/$BIN

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp out/$BIN LICENSE README.md docs/sssnake.1 stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${TAG##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          mkdir -p out
          cc -O2 -w -arch ${{ matrix.arch }} $SOURCES -o out/$BIN
          strip out/$BIN
          file out/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp out/$BIN LICENSE README.md docs/sssnake.1 stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "sssnake $TAG" \
                 --notes "sssnake ${TAG%%-av.*} from github.com/AngelJumbo/sssnake, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
